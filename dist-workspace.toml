[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
features = ["lsp"]
# includes `apps/inspector/src-tauri` (a Tauri desktop app pulling the GTK stack)
precise-builds = true
installers = ["shell", "homebrew", "npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
checksum = "sha256"
tap = "hoodiecollin/homebrew-tap"
npm-scope = "@hoodiecollin"
publish-jobs = ["homebrew", "./publish-npm"]
