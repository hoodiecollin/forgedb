[workspace]
members = [
    ".",
    "crates/parser",
    "crates/codegen",
    "crates/storage",
    "crates/storage-native",
    "crates/storage-web",
    "crates/types",
    "crates/validation",
    "crates/watcher",
    "crates/wal",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/backup",
    "crates/changefeed",
    "crates/auth",
    "crates/txn",
    "crates/coordinator",
    "crates/lsp-server",
    "crates/source-guard",
]

exclude = ["apps/inspector/src-tauri"]

resolver = "2"

[workspace.package]
edition = "2024"

[package]
name = "forgedb"
version = "0.5.0"
edition.workspace = true
authors = ["Collin Kokotas"]
license = "MIT OR Apache-2.0"
description = "ForgeDB — an application database generator. Compiles a declarative .forge schema into tailored Rust database code, a TypeScript SDK, and a REST API."
repository = "https://github.com/hoodiecollin/forgedb"
homepage = "https://github.com/hoodiecollin/forgedb"
readme = "README.md"
keywords = ["database", "codegen", "orm", "cli", "generator"]
categories = ["database", "command-line-utilities", "development-tools"]
default-run = "forgedb"

[package.metadata.wix]
upgrade-guid = "5521CC3D-47B3-47B7-BC83-24BDB265C090"
path-guid = "1F1F428E-E518-46CE-989F-600C9F5CB2FA"
license = false
eula = false

[[bin]]
name = "forgedb"
path = "src/main.rs"

[[bin]]
name = "forgedb-lsp"
path = "src/bin/forgedb-lsp.rs"
required-features = ["lsp"]

[features]
default = []
lsp = ["dep:forgedb-lsp-server"]

[dependencies]
forgedb-parser = { path = "crates/parser", version = "0.4.0" }
forgedb-codegen = { path = "crates/codegen", version = "0.5.0" }
forgedb-watcher = { path = "crates/watcher", version = "0.3.0" }
forgedb-migrations = { path = "crates/migrations", version = "0.4.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
forgedb-backup = { path = "crates/backup", version = "0.3.0" }
forgedb-coordinator = { path = "crates/coordinator", version = "0.2.2" }
forgedb-lsp-server = { path = "crates/lsp-server", version = "0.1.2", optional = true }
clap = { version = "4.4", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
ctrlc = "3.4"
home = "0.5"
dialoguer = { version = "0.12", default-features = false }

[dev-dependencies]
forgedb-parser = { path = "crates/parser", version = "0.4.0" }
forgedb-validation = { path = "crates/validation", version = "0.3.0" }
forgedb-lsp-server = { path = "crates/lsp-server", version = "0.1.2" }
forgedb-watcher = { path = "crates/watcher", version = "0.3.0" }
forgedb-wal = { path = "crates/wal", version = "0.2.0" }
forgedb-query-params = { path = "crates/query-params", version = "0.1.0" }
forgedb-migrations = { path = "crates/migrations", version = "0.4.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.8"
toml = "0.8"
home = "0.5"
regex = "1.12"

forgedb-source-guard = { path = "crates/source-guard" }

[profile.dist]
inherits = "release"
lto = "thin"
