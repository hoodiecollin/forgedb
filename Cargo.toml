[workspace]
members = [
    ".",
    "crates/parser",
    "crates/codegen",
    "crates/storage",
    "crates/storage-native",
    "crates/storage-web",
    "crates/types",
    "crates/validation",
    "crates/watcher",
    "crates/wal",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/backup",
    "crates/changefeed",
    "crates/auth",
    "crates/txn",
    "crates/coordinator",
    "crates/lsp-server",
    "apps/inspector/src-tauri",
]
resolver = "2"

# Shared package metadata. `edition` is uniform across the workspace and inherited
# via `edition.workspace = true`. Versions are intentionally NOT centralized here:
# public crates (types, storage, wal) are published to crates.io on independent
# version lines, while internal crates track their own.
[workspace.package]
edition = "2024"

[package]
name = "forgedb"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "ForgeDB — an application database generator. Compiles a declarative .forge schema into tailored Rust database code, a TypeScript SDK, and a REST API."
repository = "https://github.com/hoodiecollin/forgedb"
homepage = "https://github.com/hoodiecollin/forgedb"
readme = "README.md"
keywords = ["database", "codegen", "orm", "cli", "generator"]
categories = ["database", "command-line-utilities", "development-tools"]

[[bin]]
name = "forgedb"
path = "src/main.rs"

[dependencies]
forgedb-parser = { path = "crates/parser", version = "0.1.0" }
forgedb-codegen = { path = "crates/codegen", version = "0.1.0" }
forgedb-watcher = { path = "crates/watcher", version = "0.1.0" }
forgedb-migrations = { path = "crates/migrations", version = "0.1.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
forgedb-backup = { path = "crates/backup", version = "0.1.0" }
forgedb-coordinator = { path = "crates/coordinator", version = "0.1.0" }
clap = { version = "4.4", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ctrlc = "3.4"

[dev-dependencies]
forgedb-parser = { path = "crates/parser", version = "0.1.0" }
forgedb-validation = { path = "crates/validation", version = "0.1.0" }
forgedb-watcher = { path = "crates/watcher", version = "0.1.0" }
forgedb-wal = { path = "crates/wal", version = "0.2.0" }
forgedb-query-params = { path = "crates/query-params", version = "0.1.0" }
forgedb-migrations = { path = "crates/migrations", version = "0.1.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.8"
