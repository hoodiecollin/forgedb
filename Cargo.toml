[workspace]
members = [
    ".",
    "crates/parser",
    "crates/codegen",
    "crates/storage",
    "crates/storage-native",
    "crates/storage-web",
    "crates/types",
    "crates/validation",
    "crates/watcher",
    "crates/wal",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/backup",
    "crates/changefeed",
    "crates/auth",
    "crates/txn",
    "crates/coordinator",
    "crates/lsp-server",
    "apps/inspector/src-tauri",
]
resolver = "2"

# Shared package metadata. `edition` is uniform across the workspace and inherited
# via `edition.workspace = true`. Versions are intentionally NOT centralized here:
# public crates (types, storage, wal) are published to crates.io on independent
# version lines, while internal crates track their own.
[workspace.package]
edition = "2024"

[package]
name = "forgedb"
version = "0.3.2"
edition.workspace = true
authors = ["Collin Kokotas"]
license = "MIT OR Apache-2.0"
description = "ForgeDB — an application database generator. Compiles a declarative .forge schema into tailored Rust database code, a TypeScript SDK, and a REST API."
repository = "https://github.com/hoodiecollin/forgedb"
homepage = "https://github.com/hoodiecollin/forgedb"
readme = "README.md"
keywords = ["database", "codegen", "orm", "cli", "generator"]
categories = ["database", "command-line-utilities", "development-tools"]
# `cargo run -- <cmd>` must reach the CLI. Adding the `forgedb-lsp` bin (epic #173)
# made a bare `cargo run` ambiguous — cargo's ambiguity check counts every declared
# bin, including one gated behind a non-default `required-features` — which broke
# every documented `cargo run --` invocation (README, docs/, and `make bench-regen`).
default-run = "forgedb"

[package.metadata.wix]
upgrade-guid = "5521CC3D-47B3-47B7-BC83-24BDB265C090"
path-guid = "1F1F428E-E518-46CE-989F-600C9F5CB2FA"
license = false
eula = false

[[bin]]
name = "forgedb"
path = "src/main.rs"

# The language server binary. Behind the non-default `lsp` feature so a lean
# `cargo install forgedb` skips the async LSP stack; release archives build with
# `--features lsp` to ship `forgedb-lsp` alongside `forgedb` in one dist app
# (epic #173). `forgedb lsp` resolves the sibling and hands off to it.
[[bin]]
name = "forgedb-lsp"
path = "src/bin/forgedb-lsp.rs"
required-features = ["lsp"]

[features]
default = []
# Build the bundled `forgedb-lsp` language-server binary.
lsp = ["dep:forgedb-lsp-server"]

[dependencies]
forgedb-parser = { path = "crates/parser", version = "0.4.0" }
forgedb-codegen = { path = "crates/codegen", version = "0.3.0" }
forgedb-watcher = { path = "crates/watcher", version = "0.2.1" }
forgedb-migrations = { path = "crates/migrations", version = "0.2.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
forgedb-backup = { path = "crates/backup", version = "0.2.0" }
forgedb-coordinator = { path = "crates/coordinator", version = "0.2.1" }
# Bundled only under the `lsp` feature (drives the `forgedb-lsp` binary). Also a
# dev-dependency below so the CLI↔LSP parity test always links it, feature or not.
forgedb-lsp-server = { path = "crates/lsp-server", version = "0.1.1", optional = true }
clap = { version = "4.4", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ctrlc = "3.4"

[dev-dependencies]
forgedb-parser = { path = "crates/parser", version = "0.4.0" }
forgedb-validation = { path = "crates/validation", version = "0.3.0" }
forgedb-lsp-server = { path = "crates/lsp-server", version = "0.1.1" }
forgedb-watcher = { path = "crates/watcher", version = "0.2.1" }
forgedb-wal = { path = "crates/wal", version = "0.2.0" }
forgedb-query-params = { path = "crates/query-params", version = "0.1.0" }
forgedb-migrations = { path = "crates/migrations", version = "0.2.0" }
forgedb-compaction = { path = "crates/compaction", version = "0.1.0" }
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
