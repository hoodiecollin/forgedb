[workspace]
members = [
    ".",
    "crates/storage",
    "crates/types",
    "crates/validation",
    "crates/tests",
    "crates/cli",
    "crates/watcher",
    "crates/wal",
]
resolver = "2"

[package]
name = "sinkdb"
version = "0.1.0"
edition = "2021"

[dependencies]
sinkdb-storage = { path = "crates/storage" }
sinkdb-types = { path = "crates/types" }
sinkdb-validation = { path = "crates/validation" }
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
ordered-float = "4.2"

[dev-dependencies]
sinkdb-validation = { path = "crates/validation" }
sinkdb-watcher = { path = "crates/watcher" }
sinkdb-cli = { path = "crates/cli" }
sinkdb-wal = { path = "crates/wal" }

[lib]
name = "sinkdb"
path = "src/lib.rs"

