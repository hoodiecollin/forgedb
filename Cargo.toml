[workspace]
members = [
    ".",
    "crates/parser",
    "crates/codegen",
    "crates/storage",
    "crates/types",
    "crates/validation",
    "crates/watcher",
    "crates/wal",
    "crates/http-server",
    "crates/crud-api",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/fulltext",
    "crates/query-optimization",
    "crates/lsp-server",
    "crates/ffi",
]
resolver = "2"

# Shared package metadata. `edition` is uniform across the workspace and inherited
# via `edition.workspace = true`. Versions are intentionally NOT centralized here:
# public crates (types, storage, wal) are published to crates.io on independent
# version lines, while internal crates track their own.
[workspace.package]
edition = "2024"

[package]
name = "forgedb"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "forgedb"
path = "src/main.rs"

[dependencies]
forgedb-parser = { path = "crates/parser" }
forgedb-codegen = { path = "crates/codegen" }
forgedb-watcher = { path = "crates/watcher" }
forgedb-migrations = { path = "crates/migrations" }
forgedb-compaction = { path = "crates/compaction" }
clap = { version = "4.4", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
serde_json = "1.0"
ctrlc = "3.4"
which = "8.0"

[dev-dependencies]
forgedb-parser = { path = "crates/parser" }
forgedb-validation = { path = "crates/validation" }
forgedb-watcher = { path = "crates/watcher" }
forgedb-wal = { path = "crates/wal" }
forgedb-http-server = { path = "crates/http-server" }
forgedb-crud-api = { path = "crates/crud-api" }
forgedb-query-params = { path = "crates/query-params" }
forgedb-migrations = { path = "crates/migrations" }
forgedb-compaction = { path = "crates/compaction" }
forgedb-fulltext = { path = "crates/fulltext" }
forgedb-query-optimization = { path = "crates/query-optimization" }
insta = { version = "1.40", features = ["yaml"] }
tempfile = "3.8"
