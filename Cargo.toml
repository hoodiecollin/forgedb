[workspace]
members = [
    ".",
    "crates/storage",
    "crates/types",
    "crates/validation",
    "crates/tests",
    "crates/cli",
    "crates/watcher",
    "crates/wal",
    "crates/http-server",
    "crates/crud-api",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/fulltext",
]
resolver = "2"

[package]
name = "sinkdb"
version = "0.1.0"
edition = "2021"

[dependencies]
sinkdb-storage = { path = "crates/storage" }
sinkdb-types = { path = "crates/types" }
sinkdb-validation = { path = "crates/validation" }
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
ordered-float = "4.2"
serde_json = "1.0"

[dev-dependencies]
sinkdb-validation = { path = "crates/validation" }
sinkdb-watcher = { path = "crates/watcher" }
sinkdb-cli = { path = "crates/cli" }
sinkdb-wal = { path = "crates/wal" }
sinkdb-http-server = { path = "crates/http-server" }
sinkdb-crud-api = { path = "crates/crud-api" }
sinkdb-query-params = { path = "crates/query-params" }
sinkdb-migrations = { path = "crates/migrations" }
sinkdb-compaction = { path = "crates/compaction" }
sinkdb-fulltext = { path = "crates/fulltext" }

[lib]
name = "sinkdb"
path = "src/lib.rs"

# Comprehensive Example: Full-Featured Blog Platform
# Demonstrates ALL SinkDB features from Sprints 1-13
[[example]]
name = "blog_platform"
path = "examples/blog_platform.rs"
