[workspace]
members = [
    ".",
    "crates/storage",
    "crates/types",
    "crates/validation",
    "crates/tests",
    "crates/cli",
    "crates/watcher",
    "crates/wal",
    "crates/http-server",
    "crates/crud-api",
    "crates/query-params",
    "crates/migrations",
    "crates/compaction",
    "crates/fulltext",
    "crates/query-optimization",
    "crates/lsp-server",
    "crates/ffi",
]
resolver = "2"

[package]
name = "forgedb"
version = "0.1.0"
edition = "2021"

[dependencies]
forgedb-storage = { path = "crates/storage" }
forgedb-types = { path = "crates/types" }
forgedb-validation = { path = "crates/validation" }
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
ordered-float = "4.2"
serde_json = "1.0"
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
prettyplease = "0.2"

[dev-dependencies]
forgedb-validation = { path = "crates/validation" }
forgedb-watcher = { path = "crates/watcher" }
forgedb-cli = { path = "crates/cli" }
forgedb-wal = { path = "crates/wal" }
forgedb-http-server = { path = "crates/http-server" }
forgedb-crud-api = { path = "crates/crud-api" }
forgedb-query-params = { path = "crates/query-params" }
forgedb-migrations = { path = "crates/migrations" }
forgedb-compaction = { path = "crates/compaction" }
forgedb-fulltext = { path = "crates/fulltext" }
forgedb-query-optimization = { path = "crates/query-optimization" }

[lib]
name = "forgedb"
path = "src/lib.rs"
