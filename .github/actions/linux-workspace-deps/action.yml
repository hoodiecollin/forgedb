# System libraries a `--workspace` Rust build needs on Linux (#390).
#
# `apps/inspector/src-tauri` is a workspace MEMBER, so anything using `--workspace`
# builds the inspector's Tauri shell. On Linux that pulls gdk-sys/webkit2gtk, which are
# system libraries and are absent from a bare GitHub runner. On macOS the equivalent
# frameworks ship with the OS, which is why `cargo test --workspace` had always appeared
# to work — every past run of "the baseline" was a macOS run.
#
# This is a composite action rather than a copied block because BOTH workspace-level jobs
# need it — test.yml (tier 1) and nightly-ignored.yml (tier 2). Two copies of a package
# list drift, and the way they drift is that one job starts failing to build for a reason
# that has nothing to do with the code under test.
#
# NOT needed by substrate-reclose.yml or go-reclose.yml: they build `--bin forgedb` and a
# single `--test` target, neither of which reaches another workspace member.
name: Linux workspace deps
description: Install the GTK/WebKit system libraries the inspector's Tauri shell needs.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev libsoup-3.0-dev
