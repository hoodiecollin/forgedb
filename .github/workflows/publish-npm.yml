name: Publish (npm)

on:
  workflow_call:
    inputs:
      plan:
        description: dist release plan (JSON) — passed by cargo-dist
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    environment: npm
    permissions:
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm >= 11.5.1 (trusted-publishing floor)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Publish via OIDC trusted publishing
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
