name: Cycle scope

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scope:
    name: PR closes only current-cycle work
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck repo tooling
        run: make scripts-typecheck

      - name: Cycle-scope gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: bun scripts/check-cycle-scope.ts --pr "$PR"
