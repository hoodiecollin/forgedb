name: Website release refresh

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: website-release-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_branch, 'v') &&
           !contains(github.event.workflow_run.head_branch, '-')) }}
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch the production website deploy (from main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || 'manual' }}
        run: |
          echo "Release '$REF_NAME' finished → rebuilding the website from main."
          gh workflow run website.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f environment=production
