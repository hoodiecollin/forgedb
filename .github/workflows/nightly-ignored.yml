name: Nightly (ignored suite)

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-ignored
  cancel-in-progress: false

jobs:
  ignored:
    name: ignored suite (develop)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: Swatinem/rust-cache@v2

      - name: Tier 2 — the ignored suite
        id: suite
        run: make test-ignored

      - name: Report the failure where it will be read
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TITLE="Nightly ignored suite is failing on develop"

          # One issue, updated — not one per night. `--search` is scoped to open issues
          # carrying the marker label so a closed one starts a fresh report rather than
          # being resurrected.
          EXISTING="$(gh issue list \
            --state open --label nightly-failure --label bugfix \
            --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number // empty')"

          BODY="The nightly tier-2 run failed.

          Run: $RUN_URL
          Commit: \`${{ github.sha }}\` on \`develop\`

          These are the tests that are \`#[ignore]\`d out of the default suite because each
          one generates and compiles a crate. They run only here, so a failure means the
          scenario has been broken for at most one day — and would previously have gone
          unnoticed indefinitely (#390).

          Reproduce locally:

          \`\`\`bash
          make test-ignored
          \`\`\`"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --label bugfix \
              --label nightly-failure \
              --body "$BODY"
          fi
