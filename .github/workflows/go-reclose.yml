# cgo preamble no longer points into a cargo target directory at all: it is
name: Go reclose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclose:
    name: go-reclose (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build the forgedb CLI
        run: cargo build --release --bin forgedb

      - name: Reclose — generate, build, link, run
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          WORK="$(mktemp -d "${RUNNER_TEMP}/go-reclose.XXXXXX")"
          cd "$WORK"

          # The build cache must live outside the checkout, and this is an
          # assertion rather than a comment: the repo root Cargo.toml has
          # `members` and no `exclude`, so a cache under $GITHUB_WORKSPACE would
          # join this repo's cargo workspace and resolve every forgedb-* crate by
          # PATH — the reclose would then be measuring the checkout, silently,
          # while passing.
          export FORGEDB_HOME="$WORK/forgedb-home"
          case "$FORGEDB_HOME" in
            "${GITHUB_WORKSPACE}"*)
              echo "FAIL: FORGEDB_HOME ($FORGEDB_HOME) is inside the checkout" >&2
              exit 1;;
          esac

          # 2. Fresh project + a multi-model schema (relations exercise the
          #    relation-op codegen the single-model init default does not).
          "$FORGEDB" init app
          cd app
          # `init` scaffolds no cargo package (#335); `forgedb build` compiles in
          # the cache. If one ever comes back, step 4 is no longer what is
          # under test.
          test ! -e Cargo.toml
          cat > schema.forge <<'SCHEMA'
          Author {
            id: +uuid
            email: &string
            name: string
            posts: [Post]
          }

          Post {
            id: +uuid
            title: ^string
            body: string
            author: *Author
          }
          SCHEMA
          "$FORGEDB" validate

          # 3. Emit the Go cgo package (and, in the cache, the ffi package it
          #    links). Nothing is written outside `generated/` and the cache.
          "$FORGEDB" generate go --runtime

          # The generated cgo preamble must link the archive beside the source,
          # not a path into a cargo target directory. Asserted on the emitted
          # source, because this is the line whose earlier form made a Go binary
          # depend on a directory ForgeDB is free to delete.
          grep -q -- '-L\${SRCDIR} -lforgedb' generated/go/forgedb.go
          ! grep -q 'ffi/target/release' generated/go/forgedb.go

          # 4a. wasm32 std, installed where CARGO will run (#402).
          #
          # `forgedb build` compiles the cache WORKSPACE, and #335 emits six packages per
          # app — core, server, ffi, napi, pyo3 and **wasm**. The workspace root lists all
          # of them as members, so building it reaches the wasm member even though this
          # reclose only cares about the Go/FFI path. Without the target that surfaces as
          # `error[E0463]: can't find crate for \`core\``, which reads as a broken
          # generator rather than a missing rustup component.
          #
          # `cd` into the cache first, and that is not tidiness. substrate-reclose learned
          # it the hard way: `rustup target add` inside the CHECKOUT installs wasm32 std for
          # the `rust-toolchain.toml` pin only, the scaffold build runs under the runner's
          # default toolchain, and the build then fails with the same "can't find crate for
          # core" WHILE THE ADD STEP REPORTS SUCCESS. The toolchain split is deliberate — an
          # installed user has their own toolchain, not our pin — so rustup has to be run
          # from where cargo will be.
          (cd "$FORGEDB_HOME" && rustup target add wasm32-unknown-unknown)

          # 4. `forgedb build` compiles the cache workspace and DELIVERS the ffi
          #    staticlib to generated/go/libforgedb.a. Every substrate dep
          #    resolves from crates.io, because the cache is outside the checkout.
          "$FORGEDB" build
          test -f generated/go/libforgedb.a
          # The delivered file is an archive, not a shared object — the one
          # distinction the C8 GC turns into a crash.
          case "$(file -b generated/go/libforgedb.a)" in
            *archive*) ;;
            *) echo "FAIL: generated/go/libforgedb.a is not an archive" >&2;
               file -b generated/go/libforgedb.a >&2; exit 1;;
          esac

          # 5. Tidy (pulls arrow-go/v18) + compile the package with cgo.
          (cd generated/go && CGO_ENABLED=1 go mod tidy && CGO_ENABLED=1 go build ./...)

          # 6. Round-trip smoke: a sibling module that links the generated
          #    package via a replace directive and drives open→insert→get→assert.
          mkdir -p generated/smoke
          cat > generated/smoke/go.mod <<'GOMOD'
          module smoke

          go 1.21

          require forgedb v0.0.0

          replace forgedb => ../go
          GOMOD
          cat > generated/smoke/main.go <<'MAIN'
          package main

          import (
          	"fmt"
          	"os"

          	"forgedb"
          )

          func fail(msg string, err error) {
          	fmt.Fprintln(os.Stderr, msg, err)
          	os.Exit(1)
          }

          func main() {
          	dir, err := os.MkdirTemp("", "forgedb-go-smoke")
          	if err != nil {
          		fail("mktemp:", err)
          	}
          	defer os.RemoveAll(dir)

          	db, err := forgedb.Open(dir)
          	if err != nil {
          		fail("open:", err)
          	}
          	defer db.Close()

          	id, err := db.InsertAuthor(forgedb.Author{Email: "ada@example.com", Name: "Ada"})
          	if err != nil {
          		fail("insert:", err)
          	}

          	got, err := db.GetAuthor(id)
          	if err != nil {
          		fail("get:", err)
          	}
          	if got == nil || got.Email != "ada@example.com" || got.Name != "Ada" {
          		fmt.Fprintf(os.Stderr, "assert failed: %+v\n", got)
          		os.Exit(1)
          	}
          	fmt.Printf("OK round-trip: id=%s email=%s name=%s\n", got.Id, got.Email, got.Name)
          }
          MAIN
          # Built to a FILE rather than `go run`, because step 7 has to run the
          # same binary again after the cargo target directory is gone.
          (cd generated/smoke && CGO_ENABLED=1 go mod tidy && CGO_ENABLED=1 go build -o smoke . && ./smoke)

          # 7. THE C8 GUARD. Delete the entire cargo target directory — the build
          #    cache GC, in full — and run the binary again.
          #
          #    This is the check that would have caught the dylib mistake, and it
          #    is invisible without it: the cache still exists while CI runs, so a
          #    binary carrying an absolute LC_ID_DYLIB passes every step above and
          #    dies on the user's machine after the first `forgedb` cleanup. A
          #    statically linked archive has its contents inside the binary, so
          #    there is nothing left to dangle.
          rm -rf "$FORGEDB_HOME/projects"
          (cd generated/smoke && ./smoke)

          #    And corroborate it: nothing outside the system is resolved at load
          #    time. The successful re-run above is the primary evidence; this
          #    says WHY, so a future regression reads as a dangling reference
          #    rather than as a mystery crash.
          case "$(uname -s)" in
            Darwin)
              otool -L generated/smoke/smoke
              # Every dependency must live in a system prefix. Anything else is a
              # path baked in at link time, which is exactly the LC_ID_DYLIB
              # failure. `tail -n +2` drops the "<binary>:" header line.
              ! otool -L generated/smoke/smoke | tail -n +2 | awk '{print $1}' \
                | grep -qv -e '^/usr/lib/' -e '^/System/Library/';;
            *)
              ldd generated/smoke/smoke || true
              # `not found` is what a deleted cache looks like to the dynamic
              # loader, and the cache directory must not be named at all.
              ! ldd generated/smoke/smoke 2>/dev/null | grep -q 'not found'
              ! ldd generated/smoke/smoke 2>/dev/null | grep -q "$FORGEDB_HOME";;
          esac

          # 8. THE init() GUARD (#337; repaired in #486). Steps 6 and 7 prove a
          #    MATCHING pair runs; they say nothing about whether the check that
          #    catches a mismatched pair ever executes. This is the call-site half.
          #
          #    A [storage] knob changes durability semantics and NOT ONE exported
          #    symbol, so `go build` still succeeds — which is precisely the case
          #    the linker's undefined-symbol error cannot reach, and the honest
          #    description of what the init() check adds over it.
          #
          #    TWO DETAILS BELOW ARE LOAD-BEARING, AND BOTH WERE WRONG UNTIL #486
          #    — for which entire period this step never executed once.
          #
          #    (a) The key is set IN PLACE. `forgedb init` has scaffolded a
          #        [storage] table since v0.4.1, so appending a second header is
          #        invalid TOML: "duplicate key storage in document root", exit 10,
          #        reached before a single assertion below.
          #
          #    (b) The value is "never", not the "always" that reads as the obvious
          #        choice. "always" is the scaffold's own documented default, so
          #        setting it explicitly emits BYTE-IDENTICAL source — the archive
          #        is not stale, the smoke binary runs, and this step then fails
          #        reporting that init() did not execute, which is true only in the
          #        sense that there was nothing for it to catch. Red for a reason
          #        that sends the reader to the wrong file.
          #
          #    The fingerprint comparison is what stops (b) from recurring. The step
          #    must PROVE it induced a mismatch before it is entitled to conclude
          #    anything from whether the binary ran — otherwise the next default
          #    that shifts underneath it makes this guard vacuous in silence.
          before_fp="$(grep -o 'const forgedbFingerprint = "[^"]*"' generated/go/forgedb.go | cut -d'"' -f2)"
          test -n "$before_fp"
          sed -i.bak 's|^# fsync = "always"$|fsync = "never"|' forgedb.toml
          grep -q '^fsync = "never"$' forgedb.toml
          "$FORGEDB" generate go --runtime --force
          after_fp="$(grep -o 'const forgedbFingerprint = "[^"]*"' generated/go/forgedb.go | cut -d'"' -f2)"
          if [ "$before_fp" = "$after_fp" ]; then
            echo "FAIL: the [storage] edit did not change the generated source." >&2
            echo "Fingerprint is still $after_fp, so there is no mismatch to induce," >&2
            echo "and every assertion below would pass without proving anything." >&2
            exit 1
          fi
          # Rebuild the Go package ONLY. `forgedb build` is deliberately NOT run:
          # the point is a stale archive beside fresh source.
          (cd generated/smoke && CGO_ENABLED=1 go build -o smoke .)
          if (cd generated/smoke && ./smoke); then
            echo "FAIL: the Go binary ran against an archive built from different source." >&2
            echo "The init() fingerprint check did not execute." >&2
            exit 1
          fi
          (cd generated/smoke && ./smoke 2>&1 || true) | tee init-check.log
          grep -q 'different schema' init-check.log
          grep -q 'forgedb build' init-check.log
