name: PyPI

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/pypi.yml
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Also publish to PyPI. Use to recover a release whose tag-triggered run
          got stuck (e.g. a scarce runner never picked up a wheel). Only meaningful
          when `main` is at the exact version being (re)published — PyPI rejects a
          duplicate version, so this cannot clobber an existing release.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gnu
            runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - name: linux-aarch64-gnu
            runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
          - name: linux-x86_64-musl
            runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
          - name: macos-x86_64
            runner: macos-14
            target: x86_64
            manylinux: 'off'
          - name: macos-aarch64
            runner: macos-14
            target: aarch64
            manylinux: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke-test the wheel (same-arch runners only)
        if: ${{ matrix.name == 'linux-x86_64-gnu' || matrix.name == 'macos-aarch64' }}
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv
          # shellcheck disable=SC1091
          if [ -f .venv/bin/activate ]; then source .venv/bin/activate; else source .venv/Scripts/activate; fi
          pip install hoodiecollin-forgedb --no-index --find-links dist --force-reinstall
          forgedb --version
          # The bundled server ships as a sibling script, so `forgedb lsp` resolves it.
          command -v forgedb-lsp
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    if: >-
      ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
