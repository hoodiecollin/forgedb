name: Substrate reclose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  reclose:
    name: outside-repo init -> generate -> build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build the forgedb CLI
        run: cargo build --release --bin forgedb

      - name: Scaffold a project outside the checkout
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          # OUTSIDE the checkout: no workspace inheritance, no path overrides, so
          # every forgedb-* dep must resolve from the registry.
          WORK="$(mktemp -d "${RUNNER_TEMP}/substrate-reclose.XXXXXX")"
          cd "$WORK"

          # THE CACHE IS COLD, AND THAT IS ASSERTED (#339).
          #
          # A warm cache masks a publish gap outright: the substrate is already
          # compiled and already in the lockfile, so a version that no longer
          # exists on crates.io is never looked up and the job goes green on a
          # branch nobody could install. The default home is `~/.forgedb`, which
          # every step below deliberately steers away from — so the property to
          # hold is that nothing has been left there, at EITHER end of the run.
          #
          # The start-of-run half is not redundant with the end-of-run one. A
          # runner image that shipped a `~/.forgedb`, or a caching action someone
          # adds later, would make the end assertion pass vacuously — it would be
          # observing a directory this job never created and never read.
          test ! -e "$HOME/.forgedb"

          # FORGEDB_HOME IS AN ASSERTION, NOT A CONVENIENCE.
          #
          # The build cache is where every generated package is compiled now, so
          # the "outside the checkout" property attaches to the CACHE, not to the
          # app directory. The repo root Cargo.toml has `members` and NO
          # `exclude`, so a cache under ${{ github.workspace }} would be swallowed
          # by the repo's own workspace: the generated packages would inherit the
          # 1.96 pin and — far worse — resolve `forgedb-*` by workspace path, and
          # this check would be measuring the checkout instead of the registry.
          # Silently, and while passing.
          #
          # So it is set here, under $WORK, and asserted below rather than left as
          # a comment nobody re-reads.
          export FORGEDB_HOME="$WORK/forgedb-home"
          case "$FORGEDB_HOME" in
            "${GITHUB_WORKSPACE}"*)
              echo "FAIL: FORGEDB_HOME ($FORGEDB_HOME) is inside the checkout" >&2
              echo "The cache would join this repo's cargo workspace and resolve" >&2
              echo "forgedb-* by path, so the reclose would prove nothing." >&2
              exit 1;;
          esac

          # Before `init`, because `init` consults the claim ledger under the
          # home and so is itself a reason the directory could exist.
          test ! -e "$FORGEDB_HOME"

          "$FORGEDB" init app
          cd app

          # `init` scaffolds NO cargo package (#335). Asserted positively: if one
          # ever comes back, `forgedb build` would no longer be the thing under
          # test and the manifest arms below would be inspecting the wrong file.
          test ! -e Cargo.toml

          # A schema wide enough that the generated code touches the substrate
          # surface the packages pin — relations, an enum, an index, a
          # projection, json/decimal/optional columns.
          #
          # `decimal` in particular is load-bearing and stays: `api.rs` names
          # `rust_decimal::Decimal` absolutely only when a model declares one, so
          # a schema without it is green while every real app with a price column
          # fails to build. That shipped exactly once.
          cat > schema.forge <<'SCHEMA'
          enum Status { Draft, Published, Archived }

          Author {
            id: +uuid
            email: &string
            name: ^string
            posts: [Post]
          }

          Post {
            @projection(card: title, status)
            id: +uuid
            title: ^string
            body: string
            summary: string?
            views: u32
            price: decimal
            status: ^Status
            meta: json
            author: *Author
            editor: ?Author
          }
          SCHEMA

          "$FORGEDB" validate

          # Nothing has reserved a build container yet: `init` and `validate`
          # write no cache package, so the first `generate` starts from nothing.
          # This is the assertion the *arms* depend on — a `projects/` left over
          # from anywhere would make every compile below incremental against
          # substrate that was resolved by some earlier run.
          test ! -e "$FORGEDB_HOME/projects"

          # Hand the paths to every step below. CARGO_TARGET_DIR is shared so the
          # substrate compiles once per triple; it deliberately does NOT point at
          # the checkout's `target/`, which rust-cache owns.
          echo "FORGEDB_HOME=$FORGEDB_HOME" >> "$GITHUB_ENV"
          echo "APP=$WORK/app" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$WORK/shared-target" >> "$GITHUB_ENV"

      - name: 0/6 generate all — emit every cache package
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          # Nothing exists in the cache until a generate runs — `init` and
          # `validate` reserve nothing, so every step below (the manifest greps,
          # the resolve gate, the lockfile assertion) would otherwise be looking
          # at a directory that is not there. Hence this runs FIRST, and on its
          # own, so a failure here names generation rather than the build.
          "$FORGEDB" generate all

          # EXACTLY WHICH MANIFESTS REACH THE USER'S TREE (#339).
          #
          # An EQUALITY, not a superset. A superset would pass through the exact
          # change it exists to catch: `[placement].rust_package` defaulting on
          # would add a second manifest and read as fine. So would any new
          # emitter nobody told CI about.
          #
          # This is the checkable form of the property `forgedb init` states
          # positively at scaffold time — ForgeDB owns the build, and the one
          # cargo package it writes into the consumer's tree is the class-A REST
          # client the user compiles themselves.
          find "$APP" -name Cargo.toml | sed "s#^$APP/##" | LC_ALL=C sort \
            > "$RUNNER_TEMP/manifests.actual"
          printf '%s\n' 'generated/rust-sdk/Cargo.toml' > "$RUNNER_TEMP/manifests.expected"
          if ! diff -u "$RUNNER_TEMP/manifests.expected" "$RUNNER_TEMP/manifests.actual"; then
            echo "FAIL: the set of cargo manifests ForgeDB writes into the app has changed." >&2
            echo "A new one means an emitter started writing into a tree ForgeDB does not" >&2
            echo "own; a missing one means an arm above is no longer emitting what it claims." >&2
            exit 1
          fi

      - name: Locate the cache workspace
        shell: bash
        run: |
          set -euxo pipefail
          # Derived, never guessed. Exactly one project and exactly one app must
          # exist, and asserting that is itself worth something: a second entry
          # would mean some command reserved a container for a schema nobody
          # named, and every path below would then be picking one arbitrarily.
          ROOT="$(find "$FORGEDB_HOME/projects" -mindepth 1 -maxdepth 1 -type d)"
          test -n "$ROOT"
          test "$(printf '%s\n' "$ROOT" | wc -l)" -eq 1
          test -f "$ROOT/Cargo.toml"

          CONTAINER="$(find "$ROOT/apps" -mindepth 1 -maxdepth 1 -type d)"
          test -n "$CONTAINER"
          test "$(printf '%s\n' "$CONTAINER" | wc -l)" -eq 1

          echo "CACHE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "CACHE_APP=$CONTAINER" >> "$GITHUB_ENV"
          cat "$ROOT/Cargo.toml"

      - name: Install the wasm target (resolved from the cache workspace)
        shell: bash
        run: |
          set -euxo pipefail
          # Run from the CACHE, not from the checkout and not from $APP: that is
          # where cargo runs, so that is where rustup must resolve the same
          # toolchain. `rustup target add` inside the checkout installs wasm32 std
          # for the 1.96 pin only, and the build then fails with "can't find crate
          # for `core`" while the add step reports success.
          #
          # The toolchain split is not a defect to paper over: an installed user
          # has their own toolchain, not our pin, so building the generated
          # packages with the runner default is the more faithful reclose.
          cd "$CACHE_ROOT"
          rustup target add wasm32-unknown-unknown

      - name: Resolve gate — every pin must exist on crates.io
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CACHE_ROOT"
          # The MISSING-VERSION half of the publish gap, caught in about a second
          # and before anything compiles. `cargo generate-lockfile` exits 101 on an
          # unpublished version with the candidate list in the message — a far
          # better diagnostic than a compile failure twenty minutes in — and it
          # resolves `forgedb-storage-web` with no wasm build at all.
          #
          # It does NOT replace the compiles below: the STALE-SOURCE half (the
          # version exists, but the published source predates the API the
          # generated code calls) is invisible to resolution.
          cargo generate-lockfile

      - name: Every forgedb-* dependency resolved from the REGISTRY
        shell: bash
        run: |
          set -euo pipefail
          LOCK="$CACHE_ROOT/Cargo.lock"
          test -f "$LOCK"

          # POSITIVE form, replacing a grep for `path+file` that was dead twice
          # over. First: on cargo 1.96 / lockfile v4 a path dependency records no
          # `source` key AT ALL, so `path+file` never appears and the old check
          # could not fire. Second: after #335 no lockfile exists under $APP, so
          # the old `find "$APP" -name Cargo.lock` matched nothing and the step
          # passed HAVING INSPECTED NOTHING. Green-because-it-looked-at-nothing is
          # strictly worse than red, because nobody investigates it.
          #
          # So: every forgedb-* package in the lockfile must carry the crates.io
          # registry source, AND a named required set must all be present. The
          # required set is what makes this impossible to satisfy vacuously.
          python3 - "$LOCK" <<'PY'
          import re, sys

          lock = open(sys.argv[1]).read()
          REGISTRY = "registry+https://github.com/rust-lang/crates.io-index"

          # The eleven the generated packages pull in today: `core` pins storage,
          # types, changefeed, wal, compaction, txn and (under cfg(not(wasm32)))
          # coordinator; storage is a facade over storage-native + storage-web;
          # `server` adds auth and query-params. Named rather than counted, so a
          # missing one says WHICH.
          REQUIRED = {
              "forgedb-auth", "forgedb-changefeed", "forgedb-compaction",
              "forgedb-coordinator", "forgedb-query-params", "forgedb-storage",
              "forgedb-storage-native", "forgedb-storage-web", "forgedb-txn",
              "forgedb-types", "forgedb-wal",
          }

          seen, bad = {}, []
          for block in lock.split("[[package]]"):
              name = re.search(r'^name = "(.+)"$', block, re.M)
              if not name or not name.group(1).startswith("forgedb-"):
                  continue
              name = name.group(1)
              src = re.search(r'^source = "(.+)"$', block, re.M)
              seen[name] = src.group(1) if src else None
              if seen[name] != REGISTRY:
                  bad.append((name, seen[name]))

          for n in sorted(seen):
              print("ok: %s <- %s" % (n, seen[n]))

          fail = False
          if bad:
              fail = True
              print("\nFAIL: these resolved from something other than crates.io:")
              for n, s in bad:
                  print("  %s: %r (a null source means a PATH dependency)" % (n, s))

          missing = REQUIRED - set(seen)
          if missing:
              fail = True
              print("\nFAIL: %d required substrate crate(s) absent from the lockfile:" % len(missing))
              for n in sorted(missing):
                  print("  " + n)
              print("Either a generated manifest stopped pinning it — in which case this")
              print("check has silently lost coverage of that crate — or the required set")
              print("above is stale. Do not simply delete the row.")

          sys.exit(1 if fail else 0)
          PY

      - name: 1/6 core + server — the two packages that pin substrate
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          # `core/` is the largest pin list in the project and NO arm covered it
          # before #335. `server/` is the only carrier of forgedb-auth[jwks-http]
          # and forgedb-query-params anywhere in this workflow — drop it and those
          # two leave coverage entirely.
          cat "$CACHE_APP/core/Cargo.toml"
          cat "$CACHE_APP/server/Cargo.toml"
          grep '^forgedb-' "$CACHE_APP/core/Cargo.toml"
          grep '^forgedb-' "$CACHE_APP/server/Cargo.toml"
          grep -q 'jwks-http' "$CACHE_APP/server/Cargo.toml"

          "$FORGEDB" build

      - name: 2/6 ffi — generate ffi, then forgedb build
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          # `--force` because `generate all` above already wrote the mirror, and
          # the mirror in the user's output directory is write-once by design
          # ("File exists: generated/database.rs. Use --force to overwrite").
          # These per-arm regenerations exist so a failure names the ARM; they are
          # not the emission this reclose depends on, which arm 0 did.
          "$FORGEDB" generate ffi --force
          cat "$CACHE_APP/ffi/Cargo.toml"
          # Zero substrate pins is the PROPERTY here, so it is asserted rather
          # than grepped for — everything this crate needs arrives through `core`,
          # which is what makes its types UNIFY with the database's.
          ! grep -q '^forgedb-' "$CACHE_APP/ffi/Cargo.toml"
          grep -q 'staticlib' "$CACHE_APP/ffi/Cargo.toml"
          "$FORGEDB" build

          # #337: the delivered half. A C consumer of ForgeDB now gets a header
          # and an archive in its own tree, and this is the only step that proves
          # a registry-resolved build produces two halves that AGREE — the
          # fingerprint macro in the header against the accessor in the archive.
          # A compile cannot see that; only linking and running can.
          test -f generated/ffi/forgedb.h
          test -f generated/ffi/libforgedb.a
          cat > csmoke.c <<'CSMOKE'
          #include <stdio.h>
          #include "forgedb.h"
          int main(void) {
            printf("header:  %s\n", FORGEDB_FINGERPRINT);
            if (!forgedb_fingerprint_ok()) {
              fprintf(stderr, "FAIL: the archive was built from different source than the header\n");
              return 1;
            }
            printf("fingerprint agrees\n");
            return 0;
          }
          CSMOKE
          case "$(uname -s)" in
            Darwin) LINK_FLAGS="-framework CoreFoundation -framework Security -lc++";;
            *)      LINK_FLAGS="-lm -ldl -lpthread -lstdc++";;
          esac
          cc -I generated/ffi csmoke.c generated/ffi/libforgedb.a $LINK_FLAGS -o csmoke
          ./csmoke

      - name: 3/6 napi — generate node --runtime, then forgedb build
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate node --runtime --force
          cat "$CACHE_APP/napi/Cargo.toml"
          ! grep -q '^forgedb-' "$CACHE_APP/napi/Cargo.toml"
          "$FORGEDB" build

          # #337: require the delivered addon. `cargo build` cannot see whether
          # the two halves agree, and it cannot see a load failure at all — the
          # addon is `dlopen`ed by Node, not by the linker.
          test -f generated/napi/forgedb.node
          grep -q '"main": "index.js"' generated/napi/package.json
          cat > nodesmoke.js <<'NODESMOKE'
          const os = require('os'), fs = require('fs'), path = require('path');
          const db = require(path.join(process.cwd(), 'generated', 'napi'));
          const h = db.ForgeDb.open(fs.mkdtempSync(path.join(os.tmpdir(), 'reclose-')));
          h.createAuthor({ email: 'a@b.c', name: 'Ada', posts: null });
          h.commit();
          const rows = h.allAuthor();
          if (rows.length !== 1 || rows[0].name !== 'Ada') {
            throw new Error('read back the wrong row: ' + JSON.stringify(rows));
          }
          console.log('node OK');
          NODESMOKE
          node nodesmoke.js

      - name: 4/6 pyo3 — generate python --runtime, then forgedb build
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate python --runtime --force
          cat "$CACHE_APP/pyo3/Cargo.toml"
          ! grep -q '^forgedb-' "$CACHE_APP/pyo3/Cargo.toml"
          # The macOS leg links this one for real. `extension-module` means the
          # cdylib does not link libpython, and the link then fails on undefined
          # `_PyModule_Create2` unless the generated build script passes
          # `-undefined dynamic_lookup` — so the build script is not optional, and
          # its absence would surface as a link error naming neither cause.
          test -f "$CACHE_APP/pyo3/build.rs"
          "$FORGEDB" build

          # #337: import the delivered extension. This is the ONLY check that can
          # see a `PyInit_<stem>` mismatch — the extension is delivered under a
          # private name and CPython resolves the init symbol from that FILENAME,
          # so a disagreement between the name and the `#[pymodule]` function is
          # invisible to `cargo build`, to `cargo check` and to every snapshot.
          test -f generated/pyo3/_forgedb_native.abi3.so
          cat > pysmoke.py <<'PYSMOKE'
          import os, sys, tempfile
          sys.path.insert(0, os.path.join(os.getcwd(), "generated", "pyo3"))
          import forgedb
          h = forgedb.ForgeDb.open(tempfile.mkdtemp())
          h.create_author({"email": "a@b.c", "name": "Ada", "posts": None})
          h.commit()
          rows = [r.to_dict() for r in h.all_author()]
          assert len(rows) == 1 and rows[0]["name"] == "Ada", rows
          print("python OK", forgedb.__fingerprint__)
          PYSMOKE
          python3 pysmoke.py

      - name: 5/6 browser read-replica — generate browser --replica (wasm32)
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate browser --replica --force
          cat "$CACHE_APP/wasm/Cargo.toml"
          ! grep -q '^forgedb-' "$CACHE_APP/wasm/Cargo.toml"
          # The only arm that resolves the storage facade's wasm side
          # (forgedb-storage -> forgedb-storage-web). A gap there is invisible to
          # every native arm above. `forgedb build` runs it as its own cargo
          # invocation with --target wasm32-unknown-unknown.
          "$FORGEDB" build
          # And it really produced a wasm object, rather than skipping the arm.
          test -n "$(find "$CARGO_TARGET_DIR/wasm32-unknown-unknown" -name '*.wasm' | head -1)"

      - name: 6/6 transform — migrate build over a real lineage
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          # The shared CARGO_TARGET_DIR deliberately stays ON here. It used to be
          # unset for this step, because `migrate build` hardcoded a path and
          # reported one nothing was at (#292). That workaround is what found the
          # bug, so keeping the redirect is now the POINT of the step: it is the
          # only place the real transformer, built against the PUBLISHED
          # substrate, is asked for its path under a redirected target dir.

          # The transformer replays a RECORDED lineage and refuses a synthesized
          # jump, so a v1 -> v2 hop has to exist before it can be built.
          #
          # `--no-auto`, not `--auto`: #374 REMOVED `--auto` (detection is what
          # `migrate create` does, so there is no flag for it) and gave the new
          # spelling the opposite meaning — it opts out of the interactive
          # PROMPT, not of detection. A session with no terminal already behaves
          # as if it were passed, so this changes nothing about what runs; it
          # makes the workflow SAY so rather than depend on tty detection, and a
          # change ForgeDB cannot prove a value for then fails naming itself
          # instead of hanging on a question nobody can answer.
          "$FORGEDB" migrate create baseline --no-auto --schema schema.forge
          perl -pi -e 's/^  summary: string\?$/  summary: string?\n  subtitle: string?/' schema.forge
          grep -n 'subtitle' schema.forge
          "$FORGEDB" migrate create add-subtitle --no-auto --schema schema.forge
          "$FORGEDB" migrate status --schema schema.forge

          # `migrate build` emits `transform-1-2/` as a member of the SAME cache
          # workspace and compiles it through the same driver `forgedb build` uses
          # — one cargo-spawning path in the CLI, not two (#335 step 8).
          "$FORGEDB" migrate build --schema schema.forge --from 1 --to 2 | tee build.log
          grep '^forgedb-' "$CACHE_APP/transform-1-2/Cargo.toml"

          # #292, name-agnostic: derive the path from the CLI's OWN report rather
          # than from a name this workflow spells. The package is range-stamped and
          # per-app now (`<slug>-<hash>-transform-1-2`), so a literal here would be
          # wrong at the first rename — and the exit code cannot carry the property
          # anyway, since the defect was exit 0 naming a file that was not there.
          #
          # perl, not `sed -e 's/\x1b...'`: BSD sed on macos-14 does not
          # understand \x escapes, and this job runs on both.
          BIN="$(perl -pe 's/\e\[[0-9;]*m//g' build.log \
                 | perl -ne 'print $1 if /Built transformer: (.+?)\s*$/' | head -1)"
          test -n "$BIN"
          test -x "$BIN"
          case "$BIN" in
            "$CARGO_TARGET_DIR"/*) ;;
            *) echo "FAIL: reported $BIN is not under $CARGO_TARGET_DIR" >&2; exit 1;;
          esac

          # This epic's own property, wider than the old
          # `test ! -e migrations/transform/target`: `migrations/transform` does
          # not exist at all, and nothing under the app is a build directory.
          #
          # NOT "no Cargo.toml under $APP" — `generate all` legitimately emits
          # `generated/rust-sdk/Cargo.toml`, a class-A REST client the user
          # compiles themselves. The app ROOT having none is asserted at scaffold
          # time, which is the claim that actually matters.
          test ! -e migrations/transform
          test -z "$(find "$APP" -name target -type d | head -1)"
          test ! -e Cargo.toml

          # The other half of the cold-cache pair (#339). Every step above steered
          # the cache to $FORGEDB_HOME under $WORK; if anything reached the
          # default home instead, this run compiled somewhere the next run would
          # find WARM — and the whole check would then be measuring its own
          # leftovers rather than crates.io.
          test ! -e "$HOME/.forgedb"

      - name: Report open release gates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gates="$(gh issue list --label release-gate --state open \
                     --json number,title,milestone \
                     --jq '.[] | "  #\(.number) [\(.milestone.title // "no milestone")] \(.title)"')"
          if [ -n "$gates" ]; then
            echo "Open release gates — these block the tag:"
            echo "$gates"
          else
            echo "No open release gates."
          fi

  migrate:
    name: migrate_tests against the published substrate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Run migrate_tests
        run: cargo test --test migrate_tests -- --ignored --nocapture

  parent-workspace:
    name: reclose under a foreign cargo workspace root
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build the forgedb CLI
        run: cargo build --release --bin forgedb

      - name: Scaffold a foreign workspace root, and an app beneath it
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          test ! -e "$HOME/.forgedb"

          # `pwd -P` because every path comparison below is a string compare
          # against what cargo reports, and cargo canonicalizes.
          WORK="$(cd "$(mktemp -d "${RUNNER_TEMP}/parent-workspace.XXXXXX")" && pwd -P)"
          cd "$WORK"

          export FORGEDB_HOME="$WORK/forgedb-home"
          case "$FORGEDB_HOME" in
            "${GITHUB_WORKSPACE}"*)
              echo "FAIL: FORGEDB_HOME ($FORGEDB_HOME) is inside the checkout" >&2
              exit 1;;
          esac
          test ! -e "$FORGEDB_HOME"

          # The foreign root. `resolver = "2"`, not "3", deliberately: it is the
          # commoner consumer shape and the more adversarial one, since ForgeDB's
          # own cache root pins "3".
          mkdir -p consumer/src
          cat > Cargo.toml <<'ROOT'
          [workspace]
          members = ["consumer"]
          resolver = "2"
          ROOT
          cat > consumer/Cargo.toml <<'MEMBER'
          [package]
          name = "consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          MEMBER
          echo 'fn main() {}' > consumer/src/main.rs

          # Captured BEFORE `init`, compared after `build`. This file is the one
          # thing above the app that ForgeDB must never touch.
          ROOT_SHA="$(sha256sum Cargo.toml | cut -d' ' -f1)"

          "$FORGEDB" init app
          cd app
          test ! -e Cargo.toml
          test ! -e "$FORGEDB_HOME/projects"

          # The same schema shape the bare job uses — relations, an enum, an
          # index, a projection, json/decimal/optional columns — because `api.rs`
          # names `rust_decimal::Decimal` absolutely only when a model declares
          # one, and the SDK's generated types follow the same surface.
          cat > schema.forge <<'SCHEMA'
          enum Status { Draft, Published, Archived }

          Author {
            id: +uuid
            email: &string
            name: ^string
            posts: [Post]
          }

          Post {
            @projection(card: title, status)
            id: +uuid
            title: ^string
            body: string
            summary: string?
            views: u32
            price: decimal
            status: ^Status
            meta: json
            author: *Author
            editor: ?Author
          }
          SCHEMA

          # Narrowed to the three surfaces this job is about. The four wrappers
          # pin zero substrate and are covered arm by arm in the job above.
          sed -i 's/^targets = \["all"\]$/targets = ["rust", "api", "rust-sdk"]/' forgedb.toml
          grep -q 'targets = \["rust", "api", "rust-sdk"\]' forgedb.toml

          "$FORGEDB" validate

          echo "FORGEDB_HOME=$FORGEDB_HOME" >> "$GITHUB_ENV"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "APP=$WORK/app" >> "$GITHUB_ENV"
          echo "ROOT_SHA=$ROOT_SHA" >> "$GITHUB_ENV"

      - name: P1 foreign root — the cache is immune
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate all

          ROOT="$(find "$FORGEDB_HOME/projects" -mindepth 1 -maxdepth 1 -type d)"
          test -n "$ROOT"
          test "$(printf '%s\n' "$ROOT" | wc -l)" -eq 1
          echo "CACHE_ROOT=$ROOT" >> "$GITHUB_ENV"

          # The epic's central claim, as a check: a cargo workspace nested inside
          # another one is NOT swallowed — cargo resolves the innermost root that
          # declares `[workspace]`, and the cache declares one. Ask cargo, at the
          # cache, rather than reasoning about it.
          test "$(cd "$ROOT" && cargo locate-project --workspace --message-format plain)" \
             = "$ROOT/Cargo.toml"

          # And the driver agrees: the invocation ForgeDB is about to make names
          # the CACHE manifest, never the foreign one it is sitting under.
          "$FORGEDB" build --plan | tee plan.log
          grep -q -- "--manifest-path $ROOT/Cargo.toml" plan.log
          ! grep -q -- "--manifest-path $WORK/Cargo.toml" plan.log

          "$FORGEDB" build

          # Its own lockfile and its own target dir — the two things a swallowed
          # workspace would NOT have, because it would share the parent's.
          test -f "$ROOT/Cargo.lock"
          test -d "$ROOT/target"
          # …and the foreign root has neither yet: nothing ForgeDB did resolved
          # anything on the consumer's behalf.
          test ! -e "$WORK/Cargo.lock"

      - name: P2 foreign root — ForgeDB writes nothing it does not own
        shell: bash
        run: |
          set -euxo pipefail
          cd "$WORK"
          # sha256 captured before `init`, compared after `build`. #338's own arm
          # inverts this assertion for its mode, which is why the two live in
          # different steps rather than being reconciled into one.
          AFTER_SHA="$(sha256sum Cargo.toml | cut -d' ' -f1)"
          if [ "$ROOT_SHA" != "$AFTER_SHA" ]; then
            echo "FAIL: ForgeDB modified the foreign workspace root it does not own." >&2
            cat Cargo.toml >&2
            exit 1
          fi
          # Named separately from the checksum: `members` is the specific edit
          # that would be tempting (and that #338 explicitly refuses), and a
          # checksum failure alone would not say which line moved.
          grep -q 'members = \["consumer"\]' Cargo.toml

      - name: P3 class-A output — the generated Rust SDK, adopted and built
        shell: bash
        run: |
          set -euxo pipefail
          # THE FIRST TIME ANYTHING ANYWHERE COMPILES THIS CRATE.
          #
          # `RustSdkGenerator` is covered by string snapshots and by a
          # `syn::parse_file` at generation time. Parsing is not compiling: the
          # emitted crate names `reqwest`, `serde` and `serde_json` types it has
          # never been type-checked against, and a snapshot passes on code that
          # does not build.
          #
          # ADOPTED, not built in place. Under a foreign root a `cargo build`
          # inside the SDK directory fails — cargo's documented behaviour for a
          # package under a workspace root that is not a member — and the fix that
          # would make it pass, a `[workspace]` table in the generated package, is
          # withdrawn (#430): a nested one that any member path-depends on fails
          # the whole workspace. So the consumer adopts it with one path dep, the
          # way #338's model already prescribes for the in-tree package, and cargo
          # makes it an implicit member.
          #
          # The pre-adoption failure is deliberately NOT asserted. Encoding
          # cargo's error text as a required property would make a future cargo
          # relaxation read as a ForgeDB regression, and the property worth
          # holding is "a consumer in a workspace can build what we wrote".
          test -f "$APP/generated/rust-sdk/Cargo.toml"

          cat >> "$WORK/consumer/Cargo.toml" <<'DEP'
          forgedb-client = { path = "../app/generated/rust-sdk" }
          DEP
          # A `main` that CONSTRUCTS the client: a path dep alone would compile
          # the crate but exercise none of its public surface, so a client whose
          # constructor did not typecheck against the consumer's own edition and
          # feature set would still pass.
          cat > "$WORK/consumer/src/main.rs" <<'MAIN'
          fn main() {
              let _c = forgedb_client::ForgeDbClient::new("http://127.0.0.1:3000");
          }
          MAIN

          cd "$WORK"
          # From the workspace ROOT, not from the SDK directory — that is the
          # whole point of the step.
          cargo build -p consumer

          # …and cargo agrees it is a member, rather than merely a directory that
          # happened to compile. `--no-deps` lists exactly the workspace members.
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/meta.json"
          python3 - "$RUNNER_TEMP/meta.json" "$FORGEDB_HOME" <<'PY'
          import json, sys

          meta = json.load(open(sys.argv[1]))
          home = sys.argv[2]
          members = {p["name"]: p["manifest_path"] for p in meta["packages"]}

          if "forgedb-client" not in members:
              print("FAIL: the SDK is not a workspace member. Members: %s" % sorted(members))
              print("It compiled, but as something cargo does not consider part of this")
              print("workspace — which is not the shape a consumer adopting it would get.")
              sys.exit(1)
          print("ok: forgedb-client is a member at %s" % members["forgedb-client"])

          leaks = sorted(n for n, m in members.items() if m.startswith(home))
          if leaks:
              print("FAIL: the consumer's build graph reaches into ForgeDB's cache: %s" % leaks)
              print("The cache is derived state and may be deleted at any time (C8); a")
              print("consumer build that depends on it breaks the moment it is pruned.")
              sys.exit(1)
          print("ok: no member resolves under %s" % home)
          PY

          # `members` was never edited — adoption is a path dep from a crate the
          # consumer owns, and cargo joins the package on its own.
          test "$(sha256sum Cargo.toml | cut -d' ' -f1)" = "$ROOT_SHA"

      - name: P4 in-tree — the consumer's own build graph resolves the substrate
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          # THE SEVENTH RECLOSE SURFACE (#338, checklist item on #339).
          #
          # In-tree placement is the FIRST surface where ForgeDB's substrate pins
          # land in the USER's own build graph — their lockfile, their feature
          # unification, their toolchain — rather than in a directory ForgeDB
          # owns. #338's own tier-2 coverage builds the consumer workspace through
          # `[patch.crates-io]` pointing at the checkout, which proves the emitted
          # package COMPILES and says nothing about registry resolution: a patch
          # table is precisely the thing that makes a registry lookup not happen.
          #
          # There is no `[patch.crates-io]` anywhere in this job.
          cd "$APP"
          cat >> forgedb.toml <<'PLACE'

          [placement]
          rust_package = "forgedb-core"
          PLACE
          "$FORGEDB" generate all --force | tee intree.log

          # THE DEP LINE IS EXTRACTED FROM THE CLI'S OWN OUTPUT, NOT SPELLED HERE.
          #
          # ForgeDB prints this line and never writes it — which of a consumer's
          # crates should depend on the database is not knowable. The package name
          # is derived (`<app>-core`), so a literal here would be wrong at the
          # first rename, and the `package =` rename is not optional: cargo
          # matches a path dep's KEY against the package's own name.
          #
          # `test -n` is not decoration. An empty extraction makes the append a
          # no-op, `cargo build` then succeeds having compiled nothing new, and
          # the step reports green having proved nothing. That is not
          # hypothetical: it is how the first draft of this step behaved, because
          # the CLI prefixes the line with an info glyph.
          DEP_LINE="$(perl -pe 's/\e\[[0-9;]*m//g' intree.log \
                      | perl -ne 'print "$1\n" if /(forgedb_core = \{[^}]*\})/' | head -1)"
          test -n "$DEP_LINE"

          # Re-based against the consumer crate's own directory, exactly as the
          # CLI's message instructs: the printed `path` is relative to the
          # directory `generate` ran in, and the consumer is a sibling of it.
          REBASED="$(printf '%s\n' "$DEP_LINE" | perl -pe 's{path = "}{path = "../app/}')"
          REL="$(printf '%s\n' "$REBASED" | perl -ne 'print $1 if /path = "([^"]+)"/')"
          test -n "$REL"
          # The re-base is checked before it is pasted, so a broken one fails as
          # itself rather than as a cargo error about a missing manifest.
          test -f "$WORK/consumer/$REL/Cargo.toml"
          printf '%s\n' "$REBASED" >> "$WORK/consumer/Cargo.toml"

          cd "$WORK"
          cargo build -p consumer

          # Every forgedb-* in the CONSUMER's lockfile carries the crates.io
          # source. `forgedb-client` is excluded by name because it is the path
          # dep P3 adopted — a local member, legitimately sourceless.
          python3 - "$WORK/Cargo.lock" <<'PY'
          import re, sys

          lock = open(sys.argv[1]).read()
          REGISTRY = "registry+https://github.com/rust-lang/crates.io-index"
          LOCAL = {"forgedb-client"}

          # Named rather than counted, so a missing one says WHICH. `server` is not
          # emitted in-tree by design (class D is `core` only), so auth and
          # query-params are not expected here; the storage facade's wasm side is
          # pulled in by the manifest's own target table.
          REQUIRED = {
              "forgedb-changefeed", "forgedb-compaction", "forgedb-coordinator",
              "forgedb-storage", "forgedb-storage-native", "forgedb-txn",
              "forgedb-types", "forgedb-wal",
          }

          seen, bad = {}, []
          for block in lock.split("[[package]]"):
              m = re.search(r'^name = "(.+)"$', block, re.M)
              if not m or not m.group(1).startswith("forgedb-") or m.group(1) in LOCAL:
                  continue
              name = m.group(1)
              src = re.search(r'^source = "(.+)"$', block, re.M)
              seen[name] = src.group(1) if src else None
              if seen[name] != REGISTRY:
                  bad.append((name, seen[name]))

          for n in sorted(seen):
              print("ok: %s <- %s" % (n, seen[n]))

          fail = False
          if bad:
              fail = True
              print("\nFAIL: these resolved from something other than crates.io:")
              for n, s in bad:
                  print("  %s: %r (a null source means a PATH dependency)" % (n, s))
              print("This is the CONSUMER's lockfile. A path source here means the")
              print("in-tree package reached something outside the registry, which an")
              print("installed user's build cannot.")

          missing = REQUIRED - set(seen)
          if missing:
              fail = True
              print("\nFAIL: absent from the consumer's lockfile: %s" % sorted(missing))
              print("Either the in-tree package stopped pinning it — in which case this")
              print("check has silently lost coverage — or the required set is stale.")
              print("Do not simply delete the row.")

          sys.exit(1 if fail else 0)
          PY

          # Still untouched, after two adoptions.
          test "$(sha256sum Cargo.toml | cut -d' ' -f1)" = "$ROOT_SHA"
