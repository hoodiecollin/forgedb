# Substrate outside-repo reclose — the "is `main` actually releasable?" check.
#
# ForgeDB's generated code links the substrate crates by their scaffold-pinned
# versions, resolved from crates.io. That creates a failure mode with no in-repo
# symptom: work lands that makes generated code call a substrate API which has not
# been published yet, an in-tree `cargo build` resolves it by workspace path and
# passes, and an installed user resolving from the registry cannot build at all.
# CI is green and the branch is unshippable. See CLAUDE.md → publish-gap rule, and
# ai-pm-playbook PLAYBOOK.md §5.2.
#
# No test suite can catch that, because what is broken is the relationship between
# this repo and crates.io, and the repo cannot observe it. The only proof is this:
# scaffold a project OUTSIDE the checkout, generate into it, and build it with
# every `forgedb-*` dependency resolved from the registry. If a needed API is
# unpublished, the build fails here and nowhere else.
#
# WHY THIS RUNS ON `main` AND NOT ON `develop`
#
# `develop` is where the current release cycle integrates and is *allowed* to carry
# a publish gap — that is the whole point of holding the gap off the default branch.
# Requiring this check there would leave it red for an entire cycle, and a check
# that is always red is a check nobody reads. `main` is the branch that must stay
# releasable, so this is where the gate belongs. The release order it enforces:
# publish the substrate -> merge develop -> main -> tag.
#
# WHY ALL SIX SCAFFOLDS, NOT JUST THE SERVER
#
# `generate all` is one of six emitters that write a `Cargo.toml` pinning substrate
# crates, and each pins a DIFFERENT set. Checking only the server app left five
# scaffolds unverified, and the gaps they can hide are not hypothetical:
#
#   * `replica` is the only scaffold that resolves `forgedb-storage` on `wasm32`,
#     where the facade re-exports `forgedb-storage-web` instead of the native
#     backend. A web-backend publish gap is invisible to every other scaffold.
#   * `transform` and `ffi` pin `forgedb-coordinator`, which the replica cfg-gates
#     out entirely.
#   * `napi`/`pyo3` compile the same `database.rs` behind a different binding
#     surface, so a substrate signature change lands on them first.
#
# Each is a separate step so a failure names the scaffold instead of "the build".
#
# WHY `cargo check` FOR SOME OF THEM
#
# `napi` and `pyo3` are extension-module `cdylib`s: their link step resolves host
# symbols supplied by Node or libpython at load time, which is `napi build` /
# `maturin`'s job and not this workflow's question. Linking them here would test
# the CI runner's Python headers, not the registry. `cargo check` answers exactly
# what the reclose asks — do the pins resolve, and does the generated code compile
# against the published API — and gives up almost nothing, because an unpublished
# Rust API fails at name/trait resolution, long before any linker runs.
name: Substrate reclose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run before cutting a tag, and any time you want to know whether the gap is
  # currently open without waiting for a merge.
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  reclose:
    name: outside-repo init -> generate -> build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml (channel 1.96).
      - uses: Swatinem/rust-cache@v2

      - name: Add the wasm32 target (for the browser read-replica scaffold)
        run: rustup target add wasm32-unknown-unknown

      - name: Build the forgedb CLI
        run: cargo build --release --bin forgedb

      - name: Scaffold a project outside the checkout
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          # OUTSIDE the checkout: no workspace inheritance, no path overrides, so
          # every forgedb-* dep must resolve from the registry.
          WORK="$(mktemp -d "${RUNNER_TEMP}/substrate-reclose.XXXXXX")"
          cd "$WORK"

          "$FORGEDB" init app
          cd app

          # A schema wide enough that the generated code touches the substrate
          # surface the scaffolds pin — relations, an enum, an index, a
          # projection, json/decimal/optional columns.
          cat > schema.forge <<'SCHEMA'
          enum Status { Draft, Published, Archived }

          Author {
            id: +uuid
            email: &string
            name: ^string
            posts: [Post]
          }

          Post {
            @projection(card: title, status)
            id: +uuid
            title: ^string
            body: string
            summary: string?
            views: u32
            price: decimal
            status: ^Status
            meta: json
            author: *Author
            editor: ?Author
          }
          SCHEMA

          "$FORGEDB" validate

          # Hand the app path and a SHARED target dir to the steps below. Sharing
          # it is what keeps six scaffolds affordable: the substrate compiles once
          # per target triple instead of once per scaffold. It deliberately does
          # NOT point at the checkout's `target/`, which rust-cache owns.
          echo "APP=$WORK/app" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$WORK/shared-target" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # One step per scaffold. Each prints the pins it is about to resolve, so a
      # failing log shows the requirement next to the resolution that rejected it.
      # ---------------------------------------------------------------------

      - name: 1/6 server app — generate all
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate all
          grep '^forgedb-' Cargo.toml
          cargo build

      - name: 2/6 ffi — generate ffi
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate ffi
          grep '^forgedb-' generated/ffi/Cargo.toml
          cargo build --manifest-path generated/ffi/Cargo.toml

      - name: 3/6 napi — generate node --runtime
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate node --runtime
          grep '^forgedb-' generated/napi/Cargo.toml
          # cargo check, not build — see "WHY `cargo check`" in the header.
          cargo check --manifest-path generated/napi/Cargo.toml

      - name: 4/6 pyo3 — generate python --runtime
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate python --runtime
          grep '^forgedb-' generated/pyo3/Cargo.toml
          cargo check --manifest-path generated/pyo3/Cargo.toml

      - name: 5/6 browser read-replica — generate browser --replica (wasm32)
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          "$FORGEDB" generate browser --replica
          grep '^forgedb-' generated/replica/Cargo.toml
          # The only step that resolves the storage facade's wasm arm
          # (forgedb-storage -> forgedb-storage-web). A gap there is invisible
          # to every native scaffold above.
          cargo check --manifest-path generated/replica/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: 6/6 transform — migrate build over a real lineage
        shell: bash
        env:
          FORGEDB: ${{ github.workspace }}/target/release/forgedb
        run: |
          set -euxo pipefail
          cd "$APP"
          # `migrate build` hardcodes <output>/target/release/forgedb-transform
          # and does not honour CARGO_TARGET_DIR, so the shared target dir has to
          # come off for this one step or the binary lands somewhere the CLI will
          # not look. Unsetting it also makes this step run the exact command an
          # operator runs.
          unset CARGO_TARGET_DIR

          # The transformer replays a RECORDED lineage and refuses a synthesized
          # jump, so a v1 -> v2 hop has to exist before it can be built: record
          # the baseline snapshot, change the schema, record the hop.
          "$FORGEDB" migrate create --auto baseline
          perl -pi -e 's/^  summary: string\?$/  summary: string?\n  subtitle: string?/' schema.forge
          grep -n 'subtitle' schema.forge
          "$FORGEDB" migrate create --auto add-subtitle
          "$FORGEDB" migrate status

          # `migrate build` is the operator path: it emits the transformer to
          # migrations/transform AND compiles it release. (Plain `generate
          # transform` defaults its output to ./generated, where it would
          # overwrite the app's own manifest.)
          "$FORGEDB" migrate build --from 1 --to 2
          grep '^forgedb-' migrations/transform/Cargo.toml
          test -x migrations/transform/target/release/forgedb-transform

      - name: No path dependency may have leaked into any resolve
        shell: bash
        run: |
          set -euo pipefail
          # Belt and braces: the scaffolds live outside the checkout, so a
          # `path+file://` source in a lockfile would mean a scaffold emitted a
          # path dep and the whole check proved nothing.
          fail=0
          while IFS= read -r lock; do
            if grep -q 'path+file' "$lock"; then
              echo "FAIL: $lock resolved a path dependency"
              grep -B2 'path+file' "$lock"
              fail=1
            else
              echo "ok: $lock"
            fi
          done < <(find "$APP" -name Cargo.lock -not -path '*/shared-target/*' | sort)
          exit "$fail"

      - name: Report open release gates
        # Informational: names anything still blocking the next tag. Never fails
        # the job — the reclose above is the mechanical gate; this is the human
        # one, and its rows may legitimately be open mid-cycle.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gates="$(gh issue list --label release-gate --state open \
                     --json number,title,milestone \
                     --jq '.[] | "  #\(.number) [\(.milestone.title // "no milestone")] \(.title)"')"
          if [ -n "$gates" ]; then
            echo "Open release gates — these block the tag:"
            echo "$gates"
          else
            echo "No open release gates."
          fi
