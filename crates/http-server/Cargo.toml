[package]
  edition.workspace = true
  name    = "forgedb-http-server"
  version = "0.1.0"
  license = "MIT OR Apache-2.0"
  description = "Production-ready HTTP server infrastructure for ForgeDB REST API"
  repository = "https://github.com/hoodiecollin/forgedb"
  keywords = ["database", "http", "server", "api", "forgedb"]
  categories = ["database", "web-programming::http-server"]

[dependencies]
  axum               = "0.8"
  axum-server        = { version = "0.8", features = ["tls-rustls"] }
  dashmap            = "6.2"
  http               = "1.0"
  lazy_static        = "1.4"
  prometheus         = "0.14"
  rustls             = "0.23"
  serde              = { version = "1.0", features = ["derive"] }
  serde_json         = "1.0"
  tokio              = { version = "1", features = ["full"] }
  tokio-rustls       = "0.26"
  tower              = "0.5"
  tower-http         = { version = "0.7", features = ["cors", "limit", "timeout", "trace"] }
  tracing            = "0.1"
  tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
  uuid               = { version = "1.6", features = ["v4"] }
