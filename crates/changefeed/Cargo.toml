[package]
name = "forgedb-changefeed"
version = "0.2.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Schema-agnostic change-feed broadcast + durable resumable broker primitive for ForgeDB generated servers"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "changefeed", "broadcast", "subscription", "forgedb"]
categories = ["database", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["sync"] }
crc32fast = "1.3"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tempfile = "3.8"
