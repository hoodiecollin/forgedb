[package]
name = "forgedb-types"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core type definitions for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "types", "forgedb"]
categories = ["database"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
