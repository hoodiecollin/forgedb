[package]
name = "forgedb-types"
version = "0.3.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Core type definitions for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "types", "forgedb"]
categories = ["database"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.6", features = ["v4", "serde", "js"] }

[dev-dependencies]
serde_json = "1.0"
