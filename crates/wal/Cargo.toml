[package]
name = "forgedb-wal"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Write-Ahead Log (WAL) implementation for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "wal", "forgedb", "durability"]
categories = ["database"]

[dependencies]
uuid = { version = "1.6", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.3"

[dev-dependencies]
tempfile = "3.8"
