[package]
name = "forgedb-fulltext"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Full-text search with inverted index and TF-IDF scoring for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "search", "fulltext", "index", "forgedb"]
categories = ["database", "text-processing"]

[dependencies]
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
unicode-segmentation = "1.10"

