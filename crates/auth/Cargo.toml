[package]
name = "forgedb-auth"
version = "0.2.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Schema-agnostic verify-only JWT authentication + tenant cross-check for ForgeDB generated servers"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["jwt", "auth", "multi-tenancy", "axum", "forgedb"]
categories = ["authentication", "web-programming"]

[features]
default = ["axum"]
# The axum middleware/extractor glue. Off => the pure `Authenticator` only.
axum = ["dep:axum"]
# JWKS-over-HTTP fetch + periodic refresh + key rotation (#81). Off by default to
# keep the dep surface lean (adds a blocking HTTP client); the generated server
# scaffold opts in so `.well-known/jwks.json` verification works out of the box.
jwks-http = ["dep:ureq"]

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", optional = true }
# Blocking HTTP client for the optional JWKS-over-HTTP fetch (#81). Default
# features include rustls TLS (https JWKS endpoints).
ureq = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
axum = { version = "0.8" }
