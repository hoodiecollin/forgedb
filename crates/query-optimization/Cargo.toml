[package]
name = "forgedb-query-optimization"
version = "0.1.0"
edition = "2021"

[dependencies]
forgedb-storage = { path = "../storage" }
forgedb-types = { path = "../types" }
ordered-float = "4.2"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scan_bench"
harness = false
