[package]
name = "forgedb-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C-compatible FFI bindings for ForgeDB database access"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "ffi", "bindings", "forgedb"]
categories = ["database", "external-ffi-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Minimal dependencies for basic FFI functionality

