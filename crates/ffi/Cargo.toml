[package]
name = "forgedb-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
forgedb-storage = { path = "../storage" }
forgedb-types = { path = "../types" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
lazy_static = "1.4"
thiserror = "1.0"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
tempfile = "3.8"
