[package]
name = "forgedb-compaction"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Database compaction and maintenance operations for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "compaction", "maintenance", "forgedb"]
categories = ["database"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
