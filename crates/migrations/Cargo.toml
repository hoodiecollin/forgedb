[package]
name = "forgedb-migrations"
version = "0.4.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Schema migration tools for ForgeDB"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "migrations", "forgedb", "schema"]
categories = ["database"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
