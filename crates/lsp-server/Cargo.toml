[package]
name = "forgedb-lsp-server"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Language Server Protocol implementation for ForgeDB schema language"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "lsp", "forgedb", "language-server"]
categories = ["database", "development-tools"]

# Library-only. The `forgedb-lsp` binary that ships this server lives in the root
# `forgedb` crate behind its non-default `lsp` feature, so one dist "app" carries
# both `forgedb` and `forgedb-lsp` (epic #173). This crate is never a dist app.
[package.metadata.dist]
dist = false

[dependencies]
# The LSP speaks the REAL grammar/semantics by consuming the compiler directly —
# `parse_recover()` for a resilient partial AST + all diagnostics, `validate_schema`
# via that, and `ValidationError`/`Position` as the diagnostic vocabulary. It never
# reimplements the language (the old private regex `parser.rs` was deleted in #173).
forgedb-parser = { path = "../parser", version = "0.2.0" }
forgedb-validation = { path = "../validation", version = "0.2.0" }
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
