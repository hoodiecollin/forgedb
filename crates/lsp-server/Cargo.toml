[package]
name = "forgedb-lsp-server"
version = "0.1.2"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Language Server Protocol implementation for ForgeDB schema language"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "lsp", "forgedb", "language-server"]
categories = ["database", "development-tools"]

[package.metadata.dist]
dist = false

[dependencies]
forgedb-parser = { path = "../parser", version = "0.4.0" }
forgedb-validation = { path = "../validation", version = "0.3.0" }
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
