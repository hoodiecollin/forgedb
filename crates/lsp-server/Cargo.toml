[package]
name = "forgedb-lsp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forgedb-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dev-dependencies]
