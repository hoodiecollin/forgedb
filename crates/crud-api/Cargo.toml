[package]
name = "forgedb-crud-api"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Generic CRUD operation handlers for ForgeDB database models"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "crud", "api", "forgedb"]
categories = ["database"]

[dependencies]
forgedb-storage = { path = "../storage" }
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
