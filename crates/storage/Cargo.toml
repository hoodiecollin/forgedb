[package]
name = "forgedb-storage"
version = "0.3.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Columnar storage facade for ForgeDB — re-exports the native positional-file backend on host targets and the in-memory-arena browser backend (IndexedDB/OPFS) on wasm32. Generated code links this crate and stays byte-identical across targets."
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "storage", "forgedb", "wasm"]
categories = ["database"]

# The facade selects a backend by target. Generated code keeps
# `use forgedb_storage::{FixedColumn, VariableColumn, Tombstones};` verbatim; the
# re-export below resolves to the native engine on host builds and to the
# in-memory-arena web backend on the browser read-replica target (#110). Only one
# backend is ever linked per build, so their (identical) public types never
# collide.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
forgedb-storage-native = { path = "../storage-native", version = "0.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
forgedb-storage-web = { path = "../storage-web", version = "0.2.0" }
