[package]
name = "forgedb-storage-web"
version = "0.2.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "In-memory-arena columnar storage backend for ForgeDB's browser read-replica (wasm32). Byte-identical positional semantics to the native engine; async only at the hydrate/commit boundary (IndexedDB/OPFS). Schema-agnostic substrate."
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "storage", "wasm", "indexeddb", "forgedb"]
categories = ["database", "wasm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
forgedb-wal = { path = "../wal", version = "0.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "WorkerGlobalScope",
  "Navigator",
  "StorageManager",
  "Event",
  "DomException",
  "IdbFactory",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbRequest",
  "IdbOpenDbRequest",
  "IdbCursor",
  "IdbCursorWithValue",
  "IdbCursorDirection",
  "IdbKeyRange",
  "IdbVersionChangeEvent",
  "WorkerNavigator",
  "console",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemGetDirectoryOptions",
  "FileSystemSyncAccessHandle",
  "FileSystemReadWriteOptions",
] }
