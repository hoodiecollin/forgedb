[package]
name = "forgedb-coordinator"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "MVCC Tier 3 commit coordinator for ForgeDB — unix-socket server that owns conflict detection, LSN sequencing, and turn serialization for multi-process writers on a single machine"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "mvcc", "coordinator", "forgedb"]
categories = ["database"]

[dependencies]
forgedb-txn = { path = "../txn", version = "0.1.0" }
forgedb-changefeed = { path = "../changefeed", version = "0.2.0" }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.8"
