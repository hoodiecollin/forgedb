[package]
name = "forgedb-codegen"
version = "0.2.2"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Code generators (Rust, TypeScript SDK, REST API, OpenAPI) for the ForgeDB schema compiler"
repository = "https://github.com/hoodiecollin/forgedb"
keywords = ["database", "codegen", "orm", "forgedb"]
categories = ["database", "development-tools"]

[dependencies]
forgedb-parser = { path = "../parser", version = "0.2.0" }
anyhow = "1.0"
thiserror = "2.0"
quote = "1.0"
syn = "2.0"
proc-macro2 = "1.0"
utoipa = "5.3"
utoipa-axum = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prettyplease = "0.2"

[dev-dependencies]
insta = "1.40"
