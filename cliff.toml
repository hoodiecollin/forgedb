[changelog]
header = """

All notable changes to the ForgeDB core (the `forgedb` CLI and its published
substrate crates) are documented here. This file is generated from conventional
commits with [git-cliff](https://git-cliff.org); do not edit it by hand — run
`make changelog`. The format follows [Keep a Changelog](https://keepachangelog.com),
and the project honors [Semantic Versioning](https://semver.org) per `docs/SEMVER.md`.

"""

body = """
{% if version %}\
{% else %}\
{% endif %}\
{% if commits | filter(attribute="breaking", value=true) | length > 0 %}
> **Breaking release — upgrading needs action.** Required migration steps are in
> [docs/UPGRADING.md](https://github.com/hoodiecollin/forgedb/blob/main/docs/UPGRADING.md).
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

footer = """
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/hoodiecollin/forgedb/issues/${1}))" },
]

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "\\((website|vscode|npm|pypi|winget|docker|brew|homebrew|benchmarks|bench|ci)\\)", skip = true },
  { sha = "e84d7c533861ab006fde17ba2a08426a96a5aa4b", skip = true },
  { sha = "0c0b36c9bd9bd8ca0461c584fb73f9a02992a732", skip = true },
  { sha = "776f8ca6203cf0f5c28b4939e3a9781f25dd07d9", skip = true },
  { sha = "a6e295f244a8e92981d720e141073bf0ba98e98d", skip = true },
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = ".*", skip = true },
]

protect_breaking_commits = false
filter_commits = false

tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
ignore_tags = "-(rc|alpha|beta)"

topo_order = false
sort_commits = "oldest"
